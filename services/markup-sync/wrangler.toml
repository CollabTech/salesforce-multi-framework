# SMF-12 markup sync service — Cloudflare Workers deployment (stage 49).
# Account comes from CF_ACCOUNT_ID / CLOUDFLARE_ACCOUNT_ID at deploy time; no secrets here.
# Stage 49 generates the room-token signing secret and sets it with `wrangler secret put` (stdin).
name = "smf-markup-sync"
main = "src/worker/worker.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
SMF12_RECHECK_MS = "15000"
# SMF12_ALLOWED_ORIGINS is NOT set here: stage 49 passes the observed Salesforce app origin with
# `wrangler deploy --var SMF12_ALLOWED_ORIGINS:<origin>` and verifies it. Unset/empty = deny all.

[durable_objects]
bindings = [{ name = "TLDRAW_DURABLE_OBJECT", class_name = "TldrawDurableObject" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TldrawDurableObject"]
