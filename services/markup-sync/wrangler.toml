# SMF-12 markup sync service — Cloudflare Workers deployment (stage 47).
# Account comes from CF_ACCOUNT_ID / CLOUDFLARE_ACCOUNT_ID at deploy time; no secrets here.
# The owner sets the room-token signing secret once:  wrangler secret put SMF12_ROOM_TOKEN_SECRET
name = "smf-markup-sync"
main = "src/worker/worker.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
SMF12_RECHECK_MS = "15000"
# Comma-separated origins allowed to open WebSockets (the Salesforce app origin); empty = any.
SMF12_ALLOWED_ORIGINS = ""

[durable_objects]
bindings = [{ name = "TLDRAW_DURABLE_OBJECT", class_name = "TldrawDurableObject" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TldrawDurableObject"]
